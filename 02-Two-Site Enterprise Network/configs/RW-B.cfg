!

!
upgrade fpd auto
version 15.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname RW-B
!
boot-start-marker
boot-end-marker
!
aqm-register-fnf
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
!
ip dhcp excluded-address 192.168.110.1
ip dhcp excluded-address 192.168.120.1
ip dhcp excluded-address 192.168.130.1
!
ip dhcp pool IT
 network 192.168.110.0 255.255.255.0
 default-router 192.168.110.1 
 dns-server 8.8.8.8 
!
ip dhcp pool HR
 network 192.168.120.0 255.255.255.0
 default-router 192.168.120.1 
 dns-server 8.8.8.8 
!
ip dhcp pool Guest
 network 192.168.130.0 255.255.255.0
 default-router 192.168.130.1 
 dns-server 8.8.8.8 
!
!
!
no ip domain lookup
ip domain name cisco.com
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
username sami privilege 15 secret 5 $1$N3UX$OGrn2cD1GNBvRWyGqIypW/
!
redundancy
!
!
ip tcp synwait-time 5
ip ssh version 2
! 
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 10.10.10.2 255.255.255.252
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface GigabitEthernet1/0
 no ip address
 negotiation auto
!
interface GigabitEthernet1/0.10
 description It-Gateway
 encapsulation dot1Q 10
 ip address 192.168.110.1 255.255.255.0
 ip access-group IT-ACL in
!
interface GigabitEthernet1/0.20
 description HR-Gateway
 encapsulation dot1Q 20
 ip address 192.168.120.1 255.255.255.0
 ip access-group HR-ACL in
!
interface GigabitEthernet1/0.30
 description Guest-Gatway
 encapsulation dot1Q 30
 ip address 192.168.130.1 255.255.255.0
 ip access-group Guest-ACL in
!
interface GigabitEthernet1/0.99
 encapsulation dot1Q 99
 ip address 192.168.199.120 255.255.255.0
!
router ospf 1
 network 10.10.10.0 0.0.0.3 area 0
 network 192.168.110.0 0.0.0.255 area 0
 network 192.168.120.0 0.0.0.255 area 0
 network 192.168.130.0 0.0.0.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
ip access-list extended Guest-ACL
 deny   ip 192.168.130.0 0.0.0.255 192.168.110.0 0.0.0.255
 deny   ip 192.168.130.0 0.0.0.255 192.168.120.0 0.0.0.255
 deny   ip 192.168.130.0 0.0.0.255 192.168.10.0 0.0.0.255
 deny   ip 192.168.130.0 0.0.0.255 192.168.20.0 0.0.0.255
 permit ip any any
ip access-list extended HR-ACL
 deny   ip 192.168.120.0 0.0.0.255 192.168.110.0 0.0.0.255
 deny   ip 192.168.120.0 0.0.0.255 192.168.130.0 0.0.0.255
 deny   ip 192.168.120.0 0.0.0.255 192.168.10.0 0.0.0.255
 deny   ip 192.168.120.0 0.0.0.255 192.168.30.0 0.0.0.255
 permit ip any any
ip access-list extended IT-ACL
 deny   ip 192.168.110.0 0.0.0.255 192.168.120.0 0.0.0.255
 deny   ip 192.168.110.0 0.0.0.255 192.168.130.0 0.0.0.255
 deny   ip 192.168.110.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny   ip 192.168.110.0 0.0.0.255 192.168.20.0 0.0.0.255
 permit ip any any
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
mgcp behavior rsip-range tgcp-only
mgcp behavior comedia-role none
mgcp behavior comedia-check-media-src disable
mgcp behavior comedia-sdp-force disable
!
mgcp profile default
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login local
 transport input ssh
!
!
end
